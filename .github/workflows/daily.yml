name: Daily Ten Bagger

on:
  schedule:
    # 21:07 UTC Sun-Thu = 06:07 KST Mon-Fri. Off :00 because GitHub delays
    # top-of-hour schedules most. Not earlier: US close is 20:00Z (EDT) / 21:00Z (EST).
    - cron: '7 21 * * 0-4'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD), default today KST'
        required: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: daily-ten-bagger
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      date: ${{ steps.resolve.outputs.date }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target date and skip if already published
        id: resolve
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          SKIP=false
          if [ -n "$INPUT_DATE" ]; then
            TARGET="$INPUT_DATE"
          else
            TARGET=$(TZ=Asia/Seoul date +%F)
            git fetch --depth=1 origin main
            if git cat-file -e "origin/main:content/daily/${TARGET}.json" 2>/dev/null; then
              SKIP=true
            fi
          fi
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  generate-and-deploy:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fast-forward workflow_dispatch checkout to origin/main
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate existing content
        run: cd scripts && python sync_manifest.py && python validate_content.py

      - name: Run Python tests
        run: cd scripts && python -m pytest tests/ -q

      - name: Cache universe listings
        uses: actions/cache@v6
        with:
          path: scripts/universe
          key: universe-${{ runner.os }}-${{ hashFiles('scripts/build_universe.py', 'scripts/requirements.txt') }}
          restore-keys: |
            universe-${{ runner.os }}-

      - name: Update universe listings
        run: cd scripts && python build_universe.py

      - name: Cache yfinance responses
        uses: actions/cache@v6
        with:
          path: scripts/cache
          key: yf-cache-${{ runner.os }}-${{ hashFiles('scripts/universe/*.json') }}
          restore-keys: |
            yf-cache-${{ runner.os }}-

      - name: Generate daily report
        # Must not write content/ledger/** or content/performance/** (#63 isolation).
        run: cd scripts && python generate_daily.py "${{ needs.gate.outputs.date }}"

      - name: Push PIT snapshots to ten_bagger-pit
        env:
          PIT_DATA_TOKEN: ${{ secrets.PIT_DATA_TOKEN }}
          PIT_TARGET_DATE: ${{ needs.gate.outputs.date }}
        run: cd scripts && python pit_snapshot.py

      - name: Validate daily JSON
        run: |
          cd scripts && python sync_manifest.py
          python validate_content.py

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        env:
          SITE_URL: https://tenbagger.finnaut.com
          BASE_PATH: /
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit daily content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No content changes"
          else
            git commit -m "chore: daily report $(TZ=Asia/Seoul date +%F)"
            max_attempts=3
            for attempt in $(seq 1 $max_attempts); do
              if git pull --rebase origin main && git push; then
                echo "Push succeeded on attempt $attempt"
                exit 0
              fi
              echo "Push attempt $attempt failed"
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $((attempt * 5))
              fi
            done
            echo "::error title=Push failed::Could not push after $max_attempts attempts"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: generate-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  dispatch-ledger:
    needs: [gate, generate-and-deploy, deploy]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Ledger Regenerate for target date
        env:
          GH_TOKEN: ${{ github.token }}
          AS_OF: ${{ needs.gate.outputs.date }}
        run: |
          set -euo pipefail
          gh workflow run ledger.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f "asOfDate=${AS_OF}"

  notify-telegram:
    needs: [gate, generate-and-deploy, deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest daily content
        run: git pull --ff-only origin main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Notify Telegram (optional)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: ${{ needs.gate.outputs.date }}
          SITE_URL: https://tenbagger.finnaut.com
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured; skipping."
            exit 0
          fi
          export NOTIFY_TEXT
          NOTIFY_TEXT=$(node --experimental-strip-types scripts/telegram_daily_notify.mjs "$TARGET_DATE")
          PAYLOAD=$(node -e '
            process.stdout.write(JSON.stringify({
              chat_id: process.env.TELEGRAM_CHAT_ID,
              text: process.env.NOTIFY_TEXT,
              disable_web_page_preview: false,
            }));
          ')
          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"

  notify-failure:
    needs: [gate, generate-and-deploy, deploy, dispatch-ledger]
    if: ${{ always() && (needs.gate.result == 'failure' || needs.generate-and-deploy.result == 'failure' || needs.deploy.result == 'failure' || needs['dispatch-ledger'].result == 'failure') }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Daily Ten Bagger failed — $(TZ=Asia/Seoul date +%F)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The run is still in progress, so read finished failed jobs one by one,
          # cut at the first error marker (post-job cleanup lines follow it).
          LOG_TAIL=""
          for JOB_ID in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.conclusion == "failure") | .id' || true); do
            LOG_TAIL+=$(gh api "repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs" 2>/dev/null | awk '{print} /##\[error\]/{exit}' | tail -n 40 | cut -c1-300 || true)
            LOG_TAIL+=$'\n'
          done
          BODY=$(cat <<EOF
          Daily workflow failed. See [Actions run](${RUN_URL}).

          **Last log lines of failed jobs**
          \`\`\`
          ${LOG_TAIL:-unavailable}
          \`\`\`

          **Recovery**
          1. Open the run log above
          2. Re-run via \`workflow_dispatch\` with optional date (\`YYYY-MM-DD\`)
          3. Local: \`build_universe.py\` → \`generate_daily.py\` → \`validate_content.py\`
          EOF
          )
          # Open-only title match; optional one cheap retry on empty/null
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --state open --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ]; then
            sleep 1
            EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --state open --json number --jq '.[0].number' || true)
          fi

          COMMENTED=0
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            if gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$(printf 'Failed again: %s\n\n```\n%s\n```' "$RUN_URL" "${LOG_TAIL:-unavailable}")"; then
              COMMENTED=1
            fi
          fi

          # Fail-open: if search empty/null or comment failed, still attempt create (may duplicate)
          STATUS=0
          if [ "$COMMENTED" -eq 0 ]; then
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label "ci-failure" || \
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" || \
            STATUS=$?
          fi
          echo "::error title=Daily Ten Bagger failed::Issue opened/updated. Re-run via workflow_dispatch."
          exit "$STATUS"

      - name: Notify Slack (optional)
        if: always() && env.SLACK_WEBHOOK_URL != ''
        run: |
          TITLE="Daily Ten Bagger failed — $(TZ=Asia/Seoul date +%F)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(printf '{"text":"🚨 %s\\n%s"}' "$TITLE" "$RUN_URL")
          curl -sf -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
