name: Ledger Regenerate

on:
  workflow_dispatch:
    inputs:
      asOfDate:
        description: 'PIT asOfDate YYYY-MM-DD'
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: ledger-regenerate
  cancel-in-progress: false

jobs:
  regenerate-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check out finnaut-ohlc snapshot (#174)
        # Read-only fine-grained PAT. Without it the ledger falls back to yfinance/stooq.
        id: ohlc
        continue-on-error: true
        env:
          OHLC_TOKEN: ${{ secrets.OHLC_READ_TOKEN }}
          AS_OF: ${{ inputs.asOfDate }}
        run: |
          set -euo pipefail
          [ -n "$OHLC_TOKEN" ] || { echo "::warning::OHLC_READ_TOKEN not set, using yfinance"; exit 1; }
          dir="$RUNNER_TEMP/finnaut-ohlc"
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${OHLC_TOKEN}@github.com/jee1/finnaut-ohlc.git" "$dir"
          cd "$dir"
          # Only the latest session folder <= asOfDate per market (folders are session dates).
          folders=()
          for market in krx us; do
            latest=$(git ls-tree --name-only HEAD "bars/$market/" | awk -F/ -v a="$AS_OF" '$3 <= a' | sort | tail -1)
            [ -n "$latest" ] && folders+=("$latest")
          done
          [ "${#folders[@]}" -gt 0 ] || { echo "::warning::no finnaut-ohlc snapshot <= $AS_OF"; exit 1; }
          git sparse-checkout set "${folders[@]}"
          echo "finnaut-ohlc snapshots: ${folders[*]}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Regenerate ledger and performance
        env:
          FINNAUT_OHLC_DIR: ${{ steps.ohlc.outputs.dir }}
        run: |
          cd scripts && python regenerate_ledger.py --as-of-date "${{ inputs.asOfDate }}"

      - name: Check out PIT snapshots for size-matched baseline
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: jee1/ten_bagger-pit
          token: ${{ secrets.PIT_DATA_TOKEN }}
          path: scripts/pit-data

      - name: Restore universe listings
        uses: actions/cache/restore@v6
        with:
          path: scripts/universe
          key: universe-${{ runner.os }}-${{ hashFiles('scripts/build_universe.py', 'scripts/requirements.txt') }}
          restore-keys: |
            universe-${{ runner.os }}-

      - name: Restore yfinance responses
        uses: actions/cache/restore@v6
        with:
          path: scripts/cache
          key: yf-cache-${{ runner.os }}-
          restore-keys: |
            yf-cache-${{ runner.os }}-

      - name: Refresh edge baseline (#209)
        # Advisory only: a provider failure must not block the ledger commit.
        # Weekly (Friday asOfDate): one run takes about 18 minutes.
        continue-on-error: true
        timeout-minutes: 40
        run: |
          [ "$(date -d "${{ inputs.asOfDate }}" +%u)" = 5 ] || { echo "Not Friday, skip"; exit 0; }
          cd scripts && python build_universe.py
          python edge_baseline.py --as-of-date "${{ inputs.asOfDate }}"
          find ../content/edge-baseline -name '*.json' ! -name "${{ inputs.asOfDate }}.json" -delete

      - name: Run Python fixture tests
        run: cd scripts && python -m pytest tests/test_forward_returns.py tests/test_regenerate_ledger.py -q

      - name: Validate content
        run: cd scripts && python sync_manifest.py && python validate_content.py

      - name: Export immature picks for finnaut-ohlc
        run: python3 scripts/export_picks.py

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Install, check, and build site
        env:
          SITE_URL: https://tenbagger.finnaut.com
          BASE_PATH: /
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit ledger, performance, and exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ledger/ content/performance/ content/exports/ content/edge-baseline/
          if git diff --staged --quiet; then
            echo "No ledger/performance/exports/edge-baseline changes"
          else
            git commit -m "chore: ledger regenerate asOfDate=${{ inputs.asOfDate }}"
            # sync/validate/build may leave tracked dirt outside ledger/performance;
            # rebase refuses with unstaged changes (see #96).
            git restore .
            max_attempts=3
            for attempt in $(seq 1 $max_attempts); do
              if git pull --rebase origin main && git push; then
                echo "Push succeeded on attempt $attempt"
                exit 0
              fi
              echo "Push attempt $attempt failed"
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $((attempt * 5))
              fi
            done
            echo "::error title=Push failed::Could not push after $max_attempts attempts"
            exit 1
          fi

  notify-failure:
    needs: [regenerate-ledger]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Ledger regenerate failed — asOfDate=${{ inputs.asOfDate }}"
          BODY=$(cat <<EOF
          Ledger workflow failed. See [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          **Recovery**
          1. Open the run log above
          2. Re-run via \`workflow_dispatch\` with \`asOfDate\` (\`YYYY-MM-DD\`)
          3. Local: \`npm run regenerate:ledger -- --as-of-date YYYY-MM-DD\` → \`npm run validate:content\`
          EOF
          )
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label "ci-failure" || \
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
          echo "::error title=Ledger regenerate failed::Issue opened/updated. Re-run via workflow_dispatch."
